server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Runtime config must never be cached, otherwise a redeploy with a new
    # API_BASE_URL would keep serving the old value from the browser cache.
    location = /config.json {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        expires -1;
    }

    # SPA deep-linking: unknown paths fall back to index.html so the Angular
    # router can resolve them instead of nginx returning 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
