<div class="drafted-players-container">
    <div class="component-header">
        <h2>YOUR DRAFTED PLAYERS</h2>
    </div>

    <div class="table-responsive">
        <table class="players-table">
            <thead>
                <tr>
                    <th class="col-pos">POS</th>
                    <th class="col-name">PLAYER</th>
                </tr>
            </thead>
            <tbody>
                @for(player of players(); track player.playerId) {
                <tr>
                    <td><span class="pos-badge g">{{player.position}}</span></td>
                    <td class="player-name">{{player.fullName}}</td>
                </tr>
                }
            </tbody>
        </table>
    </div>
</div>
