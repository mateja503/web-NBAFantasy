<header class="header-container">
  <div class="league-info">
    <span class="label">LEAGUE</span>
    <h1 class="league-name">{{ draftHub.leagueName() || 'Unnamed League' }}</h1>
  </div>

  <div class="draft-status">
    @if(draftStarted)
    {
      <div class="status-dot green"></div>
      <span class="status-text">LIVE DRAFT</span>
    }@else{
      <div class="status-dot red"></div>
      <span class="status-text">DRAFT NOT STARTED</span>
    }

  </div>

  <div class="button-group">
    <app-button label="Reset Timer" width="120px" (click)="resetTimer()"></app-button>
    <!-- need to implememnt the Start Draft functionality on the server before this button can be used -->
    <app-button label="Start Draft" width="120px" (click)="startDraft()"></app-button>
    <app-button label="End Draft" width="120px" (click)="endDraft()"></app-button>
  </div>


  <div class="timer-container">
    <span class="label">PICK TIMER</span>
    <div class="clock">
      <span class="time">{{ draftHub.displayTime() || '00:00' }}</span>
    </div>
  </div>
</header>
