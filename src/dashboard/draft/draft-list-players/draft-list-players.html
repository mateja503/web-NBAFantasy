<div class="card h-100 border-0 bg-transparent text-white w-100 d-flex flex-column">

    <div class="p-3 border-bottom border-secondary bg-dark-card rounded-top">
        <h5 class="text-uppercase fw-bold tracking-wider mb-3" style="color: #00fbff;">Available Players</h5>

        <div class="d-flex flex-wrap gap-1.5 mb-3 filter-pill-container">
            
        <div class="d-flex align-items-center gap-2 flex-shrink-0">
            <span class="text-uppercase  font-monospace tracking-sm filter-label" style="color: #00fbff;">
                Filter by positions:
            </span>
        </div>
            @for (pos of positions; track pos) {
                <button 
                    type="button"
                    (click)="togglePosition(pos)"
                    class="btn btn-sm filter-pill font-monospace fw-bold transition-all text-uppercase"
                    [class.active-pill]="selectedPositions().includes(pos)"
                    [class.inactive-pill]="!selectedPositions().includes(pos)"
                >
                    {{ pos }}
                </button>
            }
        </div>

        <div class="input-group">
            <span class="input-group-text bg-dark border-secondary text-muted">
                <i class="bi bi-search"></i>
            </span>
            <input type="text" [ngModel]="searchQuery()" (ngModelChange)="searchQuery.set($event)" 
                class="form-control bg-dark text-white border-secondary shadow-none placeholder-muted"
                placeholder="Search players by name...">
        </div>
    </div>

    <div class="flex-grow-1 overflow-y-auto px-2 py-2 bg-dark-card rounded-bottom list-container">
        @for (player of filteredPlayers(); track player.playerId) {
        <div class="d-flex align-items-center justify-content-between p-2 mb-2 bg-dark-row border border-secondary border-opacity-20 rounded hover-row transition-all">

            <div class="d-flex align-items-center gap-3">
                <span class="badge bg-secondary font-monospace px-2 py-1.5 position-badge text-uppercase">
                    {{ player.position }}
                </span>
                <div>
                    <div class="fw-semibold text-light fs-6 player-name">{{ player.fullName }}</div>
                </div>
            </div>

            <button (click)="draftPlayer(player.playerId)"
                [disabled]="!draftStarted"
                class="btn btn-sm btn-outline-success fw-bold px-3 text-uppercase shadow-sm hover-draft-btn">
                Draft
            </button>
        </div>
        } @empty {
        <div class="text-center py-5 text-muted">
            <p class="mb-0">No players match the chosen filters.</p>
        </div>
        }
    </div>
</div>
