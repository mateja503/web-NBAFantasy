<div class="card h-100 border-0 bg-transparent text-white w-100 d-flex flex-column">

    <div class="p-3 border-bottom border-secondary bg-dark-card rounded-top">
        <h5 class="text-uppercase fw-bold tracking-wider mb-3" style="color: #00fbff; ">Available Players</h5>

        <div class="input-group">
            <span class="input-group-text bg-dark border-secondary text-muted">
                <svg width="32px" height="32px" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"
                    transform="matrix(-1, 0, 0, 1, 0, 0)">
                    <g id="SVGRepo_bgCarrier" stroke-width="0"></g>
                    <g id="SVGRepo_tracerCarrier" stroke-linecap="round" stroke-linejoin="round"></g>
                    <g id="SVGRepo_iconCarrier">
                        <path
                            d="M11 6C13.7614 6 16 8.23858 16 11M16.6588 16.6549L21 21M19 11C19 15.4183 15.4183 19 11 19C6.58172 19 3 15.4183 3 11C3 6.58172 6.58172 3 11 3C15.4183 3 19 6.58172 19 11Z"
                            stroke="#00fbff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path>
                    </g>
                </svg>
            </span>
            <input type="text" class="form-control bg-dark text-white border-secondary shadow-none placeholder-muted"
                placeholder="Search players...">
        </div>
    </div>

    <div class="flex-grow-1 overflow-y-auto px-2 py-2 bg-dark-card rounded-bottom list-container">
        @for (player of draftPlayers; track player.playerId) {
        <div
            class="d-flex align-items-center justify-content-between p-2 mb-2 bg-dark-row border border-secondary border-opacity-20 rounded hover-row transition-all">

            <div class="d-flex align-items-center gap-3">
                <span class="badge bg-secondary font-monospace px-2 py-1.5 position-badge text-uppercase">
                    {{ player.position }}
                </span>
                <div>
                    <div class="fw-semibold text-light fs-6 player-name">{{ player.fullName }}</div>
                </div>
            </div>

            <button (click)="draftPlayer(player.playerId)"
                class="btn btn-sm btn-outline-success fw-bold px-3 text-uppercase shadow-sm hover-draft-btn">
                Draft
            </button>
        </div>
        } @empty {
        <div class="text-center py-5 text-muted">
            <p class="mb-0">No players available on the board.</p>
        </div>
        }
    </div>
</div>
