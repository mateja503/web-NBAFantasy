<div class="draft-container">

  <mat-grid-list cols="12" rowHeight="9.86vh">
    <!-- @for (tile of tiles; track tile) {
    <mat-grid-tile [colspan]="tile.cols" [rowspan]="tile.rows"
      [style.background]="tile.color">{{tile.text}}</mat-grid-tile>
    } -->

    <mat-grid-tile colspan="12" rowspan="1" class="tile-header">
      <app-draft-header (onResetTimer)="draftHub.resetTimer(1)"
        [draftStarted]="draftHub.isDraftStarted()"></app-draft-header>
    </mat-grid-tile>

    <mat-grid-tile colspan="4" rowspan="5" class="tile-draft-board">
      <app-draft-board [round]="draftHub.round()" [onTheClock]="draftHub.teamOnTheClock()"
        [draftOrder]="draftHub.draftTeams()"></app-draft-board>
    </mat-grid-tile>

    <mat-grid-tile colspan="4" rowspan="5" class="tile-draft-board">
      <app-draft-list-players [draftPlayers]="draftHub.draftPlayers()" [onTheClock]="draftHub.teamOnTheClock()"
        (onPlayerDrafted)="draftHub.draftPlayer(1, $event.playerId, $event.pick)"
        [draftStarted]="draftHub.isDraftStarted()"></app-draft-list-players>

    </mat-grid-tile>
    
    <mat-grid-tile colspan="4" rowspan="5" class="tile-draft-board">
      <app-drafted-players [draftedPlayers]="draftHub.teamsDraftedPlayers()[globalStore.selectedTeamId() ?? 0] || []"></app-drafted-players>
    </mat-grid-tile>

    <mat-grid-tile colspan="4" rowspan="3" class="tile-draft-board">
      <h1>Trades on draft night</h1>
    </mat-grid-tile>
    <mat-grid-tile colspan="8" rowspan="3" class="tile-draft-board">
      <h1>Make a trade on draft night</h1>
    </mat-grid-tile>


  </mat-grid-list>


</div>
