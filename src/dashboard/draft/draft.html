<div class="draft-container">

  <mat-grid-list cols="12" rowHeight="9.86vh">
    <!-- @for (tile of tiles; track tile) {
    <mat-grid-tile [colspan]="tile.cols" [rowspan]="tile.rows"
      [style.background]="tile.color">{{tile.text}}</mat-grid-tile>
    } -->

    <mat-grid-tile colspan="12" rowspan="1" class="tile-header">
      <app-draft-header (onResetTimer)="draftHub.resetTimer(leagueId)"
        [draftStarted]="isDraftStarted()" [draftEnded]="isDraftEnded()"></app-draft-header>
    </mat-grid-tile>

    <mat-grid-tile colspan="4" rowspan="8" class="tile-draft-board">
      <app-draft-board [round]="draftHub.round()" [onTheClock]="draftHub.teamOnTheClock()"
        [draftOrder]="draftHub.draftTeams()"></app-draft-board>
    </mat-grid-tile>

    <mat-grid-tile colspan="4" rowspan="8" class="tile-draft-board">
      <app-draft-list-players [draftPlayers]="draftHub.draftPlayers()" [onTheClock]="draftHub.teamOnTheClock()"
        (onPlayerDrafted)="draftHub.draftPlayer(leagueId, $event.playerId, $event.pick)"
        [draftStarted]="isDraftStarted()"></app-draft-list-players>

    </mat-grid-tile>
    
    <mat-grid-tile colspan="4" rowspan="8" class="tile-draft-board">
      <app-drafted-players [draftedPlayers]="draftHub.teamsDraftedPlayers()[globalStore.selectedTeamId() ?? 0] || []"></app-drafted-players>
    </mat-grid-tile>

  </mat-grid-list>

  @if (isDraftOver()) {
    <!-- Covers the whole draft page, so nothing underneath is clickable once the draft is over. -->
    <div class="draft-ended-overlay" role="alert" aria-live="assertive">
      <div class="draft-ended-panel">
        <h1>Draft Ended</h1>
      </div>
    </div>
  }

</div>
