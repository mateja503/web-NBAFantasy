<div class="draft-board-container d-flex flex-column position-absolute top-0 start-0 w-100 h-100 style-override">

  <div class="on-the-clock mb-4">
    <p class="status-label text-uppercase mb-2 mt-2">
      ROUND: {{round}}
    </p>
    <p class="status-label text-uppercase mb-4">
      ON THE CLOCK PICK: {{onTheClock?.pick ?? 'N/A'}}
    </p>
    
    <div class="d-flex align-items-center gap-3 w-100 overflow-hidden">
      <div class="team-logo d-flex align-items-center justify-content-center flex-shrink-0">
        <img src="team-logo-placeholder.png" alt="Logo" id="current-logo" class="w-75 h-auto">
      </div>
      
      <h2 id="current-team-name" class="current-team-text text-uppercase m-0 text-truncate flex-grow-1" title="{{onTheClock?.teamName ?? 'UNKNOWN'}}">
        {{onTheClock?.teamName ?? 'UNKNOWN'}}
      </h2>
    </div>
  </div>

  <div class="draft-queue flex-grow-1 border-top border-secondary pt-4 overflow-y-auto">
    <p class="queue-header text-uppercase mb-2">UP NEXT</p>
    <ul id="team-queue" class="list-unstyled p-0 m-0">
      @for(team of draftOrder; track team.teamId){
      <li class="queue-item text-truncate text-white fw-medium">
        {{team.pick}}. {{team.teamName}}
      </li>
      }
    </ul>
  </div>
</div>
